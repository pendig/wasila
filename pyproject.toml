[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wasila"
version = "0.1.0"
description = "Customer AI orchestration with memory, tickets, and owner-aware agents."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
  { name = "Wasila contributors" }
]
keywords = ["ai", "agents", "customer-support", "orchestration", "crewai", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
crewai = ["crewai>=1.14,<2"]

[project.urls]
Homepage = "https://github.com/pendig/wasila"
Issues = "https://github.com/pendig/wasila/issues"
Documentation = "https://github.com/pendig/wasila/tree/main/docs"

[project.scripts]
wasila = "wasila.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wasila"]
